name: Upload v0.6.0 EXE

on:
  push:
    paths:
      - '.github/workflows/upload-exe.yml'

jobs:
  build-and-upload:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --win nsis --x64
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v0.6.0 dist/OdakPosta-Setup-0.6.0.exe --clobber
