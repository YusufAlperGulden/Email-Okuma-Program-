# Render Blueprint — secrets are entered in the Render dashboard, never committed.
services:
  - type: web
    name: odak-kutusu
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: odak-kutusu-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: APP_TIMEZONE
        value: Europe/Istanbul
      - key: AUTO_SYNC_MINUTES
        value: "15"
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite

databases:
  - name: odak-kutusu-db
    databaseName: odak_kutusu
    user: odak_user
    plan: free
